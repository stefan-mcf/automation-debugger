[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "automation-debugger"
version = "0.1.0"
description = "Fixture-safe broken automation diagnosis and replay proof"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "pydantic>=2.0.0",
  "typer>=0.12.0",
  "fastapi>=0.110.0",
]

[project.scripts]
automation-debugger = "automation_debugger.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.4.0", "mypy>=1.10.0", "httpx>=0.27.0", "pillow>=10.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["automation_debugger*"]

[tool.ruff]
target-version = "py310"
line-length = 180
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
exclude = ["tests/", "scripts/"]
